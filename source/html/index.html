<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureCam | Dashboard</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <meta
      name="description"
      content="SecureCam security camera monitoring dashboard"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="nav-header">
          <div class="nav-controls">
            <button id="back-btn" class="back-btn hidden" title="Go Back">
              &larr; Back
            </button>
            <button
              id="home-btn"
              class="home-btn hidden"
              onclick="goHome()"
              title="Go to Dashboard"
            >
              🏠
            </button>
            <button
              id="refresh-btn"
              class="home-btn"
              onclick="manualRefresh()"
              title="Refresh Data"
            >
              🔄
            </button>
          </div>
          <div class="header-content">
            <h1 id="main-title">SecureCam</h1>
            <p id="sub-title" class="subtitle">
              Real-time status of your security system
            </p>
          </div>
        </div>
      </header>

      <div id="loading">
        <div class="spinner"></div>
      </div>

      <main id="dashboard" class="dashboard">
        <!-- Camera cards will be injected here by script.js -->
      </main>

      <section id="date-view" class="date-view hidden">
        <div class="view-actions">
          <button
            id="date-view-toggle"
            onclick="toggleMediaType()"
            class="secondary-btn"
          >
            Switch to Videos
          </button>
        </div>
        <div id="dates-grid" class="dates-grid">
          <!-- Dates will be injected here -->
        </div>
      </section>

      <section id="time-view" class="time-view hidden">
        <div id="day-navigation" class="view-actions hidden">
          <button id="prev-day-btn" onclick="prevDay()" class="secondary-btn">
            &lsaquo; Previous Day
          </button>
          <button id="next-day-btn" onclick="nextDay()" class="secondary-btn">
            Next Day &rsaquo;
          </button>
        </div>
        <div id="hour-navigation" class="view-actions hidden">
          <button id="prev-hour-btn" onclick="prevHour()" class="secondary-btn">
            &lsaquo; Previous Hour
          </button>
          <button id="next-hour-btn" onclick="nextHour()" class="secondary-btn">
            Next Hour &rsaquo;
          </button>
        </div>
        <div id="times-grid" class="dates-grid">
          <!-- Times will be injected here -->
        </div>
      </section>

      <!-- Media Modal -->
      <div id="media-modal" class="modal hidden">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-content">
          <button class="modal-close" onclick="closeModal()">&times;</button>
          <div class="modal-body">
            <button id="prev-btn" class="nav-btn prev" onclick="prevMedia()">
              &lsaquo;
            </button>
            <div id="media-container" class="media-container">
              <!-- Image or Video will be injected here -->
            </div>
            <button id="next-btn" class="nav-btn next" onclick="nextMedia()">
              &rsaquo;
            </button>
          </div>
          <div class="modal-info">
            <div class="modal-title-row">
              <h3 id="modal-title">File Title</h3>
              <select
                id="camera-select"
                onchange="switchCamera(this.value)"
                class="camera-dropdown"
              >
                <!-- Camera options will be injected here -->
              </select>
            </div>
            <p id="modal-details">File details</p>
            <div class="modal-actions">
              <button
                id="switch-btn"
                onclick="switchToNearest()"
                class="secondary-btn hidden"
              >
                Switch to Photos
              </button>
              <a id="modal-download" href="#" download class="download-btn"
                >Download</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
