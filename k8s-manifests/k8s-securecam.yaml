apiVersion: v1
kind: Namespace
metadata:
  name: securecam
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: securecam-pv
  namespace: securecam
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  storageClassName: local-path
  hostPath:
    path: /data2/securecam
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: securecam-pvc
  namespace: securecam
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: securecam-pv
---
# trunk-ignore(checkov/CKV_K8S_43)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: securecam
  namespace: securecam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: securecam
  template:
    metadata:
      labels:
        app: securecam
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: securecam
          image: ghcr.io/jeromba6/securecam:0.7.0
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: SECURECAM_DIR
              value: /data/securecam
          volumeMounts:
            - name: securecam-data
              mountPath: /data/securecam
      volumes:
        - name: securecam-data
          persistentVolumeClaim:
            claimName: securecam-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: securecam
  namespace: securecam
spec:
  type: NodePort
  selector:
    app: securecam
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: limit-securecam-access
  namespace: securecam
spec:
  podSelector:
    matchLabels:
      app: securecam
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {} # Allow ingress from all pods in the same namespace
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
